<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8"/>

    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport"
    />

    <title>Plamont Report Center</title>

    <!-- Fonte -->
    <link
        href="https://fonts.googleapis.com"
        rel="preconnect"
    />

    <link
        crossorigin=""
        href="https://fonts.gstatic.com"
        rel="preconnect"
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link
        href="splashstyle.css"
        rel="stylesheet"
    />

</head>

<body>

    <div class="splash-screen">

        <div class="splash-container">

            <!-- Logo -->
            <img
                alt="Plamont Engenharia"
                class="splash-logo"
                src="logo_horplamont_V2.png"
            />

            <!-- Título -->
            <h1 class="splash-title">
                REPORT DIÁRIO
            </h1>

            <!-- Contratos -->
            <p class="splash-contracts">
                OS 440 <span>•</span>
                OS 441 <span>•</span>
                OS 442 <span>•</span>
                OS 450 <span>•</span>
                OS 456
            </p>

            <!-- Subtítulo -->
            <p class="splash-subtitle">
                Programação diária de contratos
            </p>

            <!-- Loading -->
            <div class="splash-loading">

                <div class="loading-bar">
                    <div class="loading-fill"></div>
                </div>

                <span class="loading-text">
                    Preparando dashboard...
                </span>

            </div>

        </div>

    </div>

    <script src="splashscript.js"></script>

</body>

</html>
